spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.valorantcompanion: INFO
