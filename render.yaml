databases:
  - name: valorant-companion-db
    databaseName: valorant_companion
    plan: free

services:
  - type: web
    name: valorant-companion-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: valorant-companion-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: valorant-companion-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: valorant-companion-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: valorant-companion-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: valorant-companion-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://valorant-companion.vercel.app
